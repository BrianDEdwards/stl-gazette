<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The St. Louis Gazette</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Oswald:wght@500;700&family=Special+Elite&family=Reenie+Beanie&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="toolbar">
  <div class="group">
    <label for="edition">Edition</label>
    <select id="edition"></select>
  </div>
  <div class="group">
    <button id="uvBtn" aria-pressed="false" title="Some ink only shows under the right light">Hold to the black light</button>
    <button id="shareBtn">Share</button>
  </div>
</div>
<main class="paper" id="paper"><p>Loading the evening edition…</p></main>
<footer id="foot"></footer>

<div class="reader-wrap" id="readerWrap" role="dialog" aria-modal="true">
  <article class="reader" id="reader"></article>
</div>

<script src="js/app.js"></script>
</body>
</html>
