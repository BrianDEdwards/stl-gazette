<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The St. Louis Gazette</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Oswald:wght@500;700&family=Special+Elite&family=Reenie+Beanie&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #f1e9d6;
  --paper-edge: #e2d6b8;
  --ink: #1d1a16;
  --ink-soft: #4a4339;
  --rule: #2b2721;
  --accent: #7a1712;
  --uv: #b98cff;
  --uv-glow: rgba(185, 140, 255, .55);
  --page: #2a2622;
}
* { box-sizing: border-box; }
html { background: var(--page); }
body {
  margin: 0; padding: 24px 16px 64px;
  background: var(--page);
  color: var(--ink);
  font: 16px/1.55 "Libre Baskerville", Georgia, serif;
}
.paper {
  max-width: 1100px; margin: 0 auto; padding: 20px 28px 36px;
  background: radial-gradient(ellipse at 30% 10%, #f7f1e2 0%, var(--paper) 55%, var(--paper-edge) 100%);
  box-shadow: 0 10px 40px rgba(0,0,0,.5);
  transition: background .4s, color .4s, filter .4s;
}

/* toolbar */
.toolbar { max-width: 1100px; margin: 0 auto 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; font: 13px "Oswald", sans-serif; letter-spacing: .05em; text-transform: uppercase; color: #cfc4ad; }
.toolbar select, .toolbar button { font: inherit; letter-spacing: inherit; text-transform: inherit; background: #3a342e; color: #f1e9d6; border: 1px solid #5a5148; padding: 6px 10px; border-radius: 3px; cursor: pointer; }
.toolbar button[aria-pressed="true"] { background: #3d2a5c; border-color: var(--uv); color: #fff; box-shadow: 0 0 12px var(--uv-glow); }
.toolbar .group { display: flex; gap: 8px; flex-wrap: wrap; }

/* masthead */
.masthead { text-align: center; border-bottom: 4px double var(--rule); padding-bottom: 6px; }
.masthead .ears { display: flex; justify-content: space-between; font: 11px "Oswald", sans-serif; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); }
.masthead h1 { font: 400 clamp(40px, 9vw, 92px)/1 "UnifrakturMaguntia", serif; margin: 6px 0 4px; }
.masthead .motto { font-style: italic; font-size: 13px; color: var(--ink-soft); }
.dateline { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 16px; border-bottom: 1px solid var(--rule); padding: 5px 0; font: 12px "Oswald", sans-serif; text-transform: uppercase; letter-spacing: .08em; }

.ticker { overflow: hidden; white-space: nowrap; border-bottom: 1px solid var(--rule); padding: 4px 0; font: 13px "Oswald", sans-serif; text-transform: uppercase; letter-spacing: .05em; }
.ticker span { display: inline-block; padding-left: 100%; animation: tick 40s linear infinite; }
.ticker b { color: var(--accent); }
@keyframes tick { to { transform: translateX(-100%); } }
@media (prefers-reduced-motion: reduce) { .ticker span { animation: none; padding-left: 0; white-space: normal; } }

/* top boxes */
.topboxes { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; margin: 14px 0; }
.box { border: 1px solid var(--rule); padding: 10px 14px; position: relative; }
.box h3 { margin: 0 0 6px; font: 700 13px "Oswald", sans-serif; text-transform: uppercase; letter-spacing: .1em; border-bottom: 1px solid var(--rule); padding-bottom: 4px; }
.previously { background: rgba(0,0,0,.035); }
.previously p { margin: 0 0 6px; font-size: 14px; }
.countdown { text-align: center; }
.countdown .clock { font: 700 28px "Oswald", sans-serif; letter-spacing: .04em; color: var(--accent); }
.countdown .when { font-size: 13px; }
.countdown .tba { font-style: italic; font-size: 14px; }
.countdown button { margin-top: 6px; font: 12px "Oswald", sans-serif; text-transform: uppercase; letter-spacing: .08em; background: var(--ink); color: var(--paper); border: 0; padding: 6px 10px; cursor: pointer; }

/* main grid */
.grid { display: grid; grid-template-columns: 2fr 1fr; gap: 0 24px; }
.grid > .main { border-right: 1px solid var(--rule); padding-right: 24px; }
.article { padding: 12px 0; border-bottom: 1px solid var(--rule); cursor: pointer; position: relative; }
.article:last-child { border-bottom: 0; }
.article:hover .headline, .article:focus-visible .headline { text-decoration: underline; text-decoration-thickness: 1px; }
.article:focus-visible { outline: 2px dashed var(--accent); outline-offset: 4px; }
.kicker { font: 700 11px "Oswald", sans-serif; text-transform: uppercase; letter-spacing: .12em; color: var(--accent); }
.headline { font: 700 22px/1.15 "Libre Baskerville", serif; margin: 2px 0 4px; }
.lead .headline { font-size: clamp(28px, 4.5vw, 44px); line-height: 1.05; }
.subhead { font-style: italic; font-size: 15px; color: var(--ink-soft); margin: 0 0 6px; }
.byline { font: 11px "Oswald", sans-serif; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-soft); margin-bottom: 6px; }
.teaser p { margin: 0 0 8px; }
.teaser { margin: 0; text-align: justify; hyphens: auto; }
.lead .teaser { column-count: 2; column-gap: 22px; column-rule: 1px solid rgba(0,0,0,.2); }
.more { font: 11px "Oswald", sans-serif; text-transform: uppercase; letter-spacing: .1em; color: var(--accent); margin-top: 6px; }
.article figure { margin: 6px 0 8px; }
.article img, .reader img { width: 100%; display: block; filter: grayscale(1) contrast(1.1) sepia(.15); border: 1px solid var(--rule); }
figcaption { font-size: 12px; font-style: italic; color: var(--ink-soft); margin-top: 3px; }
.brief .headline { font-size: 17px; }

.side > section { position: relative; padding: 12px 0; border-bottom: 1px solid var(--rule); }
.side > section:last-child { border-bottom: 0; }
.side > section > h2 { font: 700 15px "Oswald", sans-serif; text-transform: uppercase; letter-spacing: .12em; margin: 0 0 8px; text-align: center; border-top: 3px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 4px 0; }
.blotter { font: 13px/1.45 "Special Elite", monospace; }
.blotter li { margin-bottom: 8px; }
.blotter ul, .classifieds ul { list-style: none; margin: 0; padding: 0; }
.blotter .t { font-weight: bold; }
.classifieds li { border: 1px solid var(--ink-soft); padding: 6px 8px; margin-bottom: 8px; font-size: 13px; position: relative; }
.classifieds li b { display: block; font: 700 12px "Oswald", sans-serif; text-transform: uppercase; letter-spacing: .08em; }
.weather { text-align: center; font-size: 14px; }
.weather .big { font: 700 24px "Oswald", sans-serif; }
.ad { border: 3px double var(--rule); text-align: center; padding: 12px; position: relative; }
.ad .ad-head { font: 700 22px/1.1 "Oswald", sans-serif; text-transform: uppercase; letter-spacing: .04em; }
.ad .ad-body { font-size: 13px; margin: 6px 0; }
.ad .note, .classifieds .note { top: auto; bottom: -10px; }
.topboxes.solo { grid-template-columns: 1fr; }
.ad .ad-foot { font: 11px "Oswald", sans-serif; text-transform: uppercase; letter-spacing: .1em; }

/* hidden ink (UV) */
.uv { color: transparent; transition: color .5s, text-shadow .5s; }
.note { position: absolute; z-index: 2; right: -6px; top: 6px; max-width: 220px; transform: rotate(-3deg); font: 22px/1 "Reenie Beanie", cursive; color: transparent; pointer-events: none; transition: color .5s, text-shadow .5s; }
body.uvon .paper { background: radial-gradient(ellipse at 50% 40%, #2b2140 0%, #15111e 70%, #0c0a10 100%); color: #8f8a9c; }
body.uvon .paper * { border-color: #3d3550 !important; }
body.uvon .kicker, body.uvon .countdown .clock, body.uvon .ticker b, body.uvon .more { color: #6d6580; }
body.uvon .uv, body.uvon .note { color: var(--uv); text-shadow: 0 0 6px var(--uv-glow), 0 0 14px var(--uv-glow); }
body.uvon .countdown button { background: #3d3550; color: #ccc; }

/* reader overlay */
.reader-wrap { position: fixed; inset: 0; background: rgba(15,12,10,.75); display: none; align-items: flex-start; justify-content: center; padding: 32px 16px; overflow-y: auto; z-index: 10; }
.reader-wrap.open { display: flex; }
.reader { background: var(--paper); max-width: 720px; width: 100%; padding: 28px 32px; position: relative; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
body.uvon .reader { background: #15111e; color: #8f8a9c; }
.reader .close { position: absolute; top: 8px; right: 10px; background: none; border: 0; font: 28px/1 "Libre Baskerville", serif; cursor: pointer; color: inherit; }
.reader .headline { font-size: clamp(26px, 5vw, 38px); }
.reader .body p { text-align: justify; hyphens: auto; }
.reader .body p:first-child::first-letter { float: left; font: 700 54px/0.85 "Libre Baskerville", serif; padding: 4px 6px 0 0; }
.reader .note { position: static; display: block; margin-top: 18px; transform: rotate(-1.5deg); max-width: none; }

footer { max-width: 1100px; margin: 14px auto 0; text-align: center; font: 12px "Oswald", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #8a806f; }
.error { color: #f1e9d6; text-align: center; font-size: 15px; }

@media (max-width: 760px) {
  body { padding: 12px 8px 40px; }
  .paper { padding: 14px 14px 24px; }
  .topboxes, .grid { grid-template-columns: 1fr; }
  .grid > .main { border-right: 0; padding-right: 0; border-bottom: 3px double var(--rule); }
  .lead .teaser { column-count: 1; }
  .note { right: 0; font-size: 20px; }
  .reader { padding: 22px 18px; }
  .masthead .ears span:last-child { display: none; }
}
</style>
</head>
<body>
<div class="toolbar">
  <div class="group">
    <label for="edition">Edition</label>
    <select id="edition"></select>
  </div>
  <div class="group">
    <button id="uvBtn" aria-pressed="false" title="Some ink only shows under the right light">Hold to the black light</button>
    <button id="shareBtn">Share</button>
  </div>
</div>
<main class="paper" id="paper"><p>Loading the evening edition…</p></main>
<footer id="foot"></footer>

<div class="reader-wrap" id="readerWrap" role="dialog" aria-modal="true">
  <article class="reader" id="reader"></article>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// Tiny markup: **bold**, *italic*, {{ink only visible under the black light}}
const fmt = s => esc(s)
  .replace(/\{\{(.+?)\}\}/g, '<span class="uv">$1</span>')
  .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
  .replace(/\*(.+?)\*/g, "<i>$1</i>");
const paras = body => (Array.isArray(body) ? body : [body || ""]).map(p => `<p>${fmt(p)}</p>`).join("");
const note = n => n ? `<div class="note" aria-hidden="true">${esc(n)}</div>` : "";

let index, ed, timer;

async function boot() {
  try {
    index = await (await fetch("editions/index.json", {cache: "no-cache"})).json();
  } catch (e) {
    $("#paper").innerHTML = `<p>The presses are jammed (couldn't load editions/index.json). If you opened this file directly, serve the folder instead.</p>`;
    return;
  }
  const sel = $("#edition");
  sel.innerHTML = index.editions.map(e => `<option value="${esc(e.id)}">${esc(e.label || e.id)}</option>`).join("");
  sel.onchange = () => { location.hash = sel.value; };
  window.onhashchange = load;
  $("#foot").textContent = index.paper.footer || "";
  load();
}

async function load() {
  const id = decodeURIComponent(location.hash.slice(1)) || index.editions[0].id;
  const entry = index.editions.find(e => e.id === id) || index.editions[0];
  $("#edition").value = entry.id;
  try {
    ed = await (await fetch(entry.file, {cache: "no-cache"})).json();
  } catch (e) {
    $("#paper").innerHTML = `<p>Couldn't load ${esc(entry.file)}: ${esc(e.message)}</p>`;
    return;
  }
  render(entry);
  const art = new URLSearchParams(location.search).get("a");
  if (art) openArticle(art);
}

function render(entry) {
  const p = Object.assign({}, index.paper, ed.paper);
  document.title = `${p.name} · ${ed.issue?.date || entry.label}`;
  const arts = ed.articles || [];
  const lead = arts.find(a => a.size === "lead") || arts[0];
  const rest = arts.filter(a => a !== lead);
  const mainArts = rest.filter(a => a.column !== "side");
  const sideArts = rest.filter(a => a.column === "side");

  $("#paper").innerHTML = `
    <header class="masthead">
      <div class="ears"><span>${esc(p.leftEar || "")}</span><span>${esc(p.rightEar || "")}</span></div>
      <h1>${esc(p.name)}</h1>
      <div class="motto">${esc(p.motto || "")}</div>
    </header>
    <div class="dateline">
      <span>${esc(ed.issue?.volume || "")}</span>
      <span>${esc(ed.issue?.date || "")}</span>
      <span>${esc(ed.issue?.edition || "")}</span>
      <span>${esc(ed.issue?.price || "")}</span>
    </div>
    ${ed.ticker?.length ? `<div class="ticker"><span>${ed.ticker.map(t => `<b>&#9670;</b> ${fmt(t)}`).join(" &nbsp; ")}</span></div>` : ""}
    <div class="topboxes ${ed.previously ? "" : "solo"}">
      ${ed.previously ? `<section class="box previously"><h3>${esc(ed.previously.title || "Previously")}</h3>${paras(ed.previously.body)}${note(ed.previously.marginalia)}</section>` : ""}
      <section class="box countdown" id="countdown"></section>
    </div>
    <div class="grid">
      <div class="main">
        ${lead ? card(lead, "lead") : ""}
        ${mainArts.map(a => card(a)).join("")}
      </div>
      <aside class="side">
        ${ed.weather ? `<section class="weather"><h2>Weather</h2><div class="big">${esc(ed.weather.headline)}</div><div>${fmt(ed.weather.text)}</div>${note(ed.weather.marginalia)}</section>` : ""}
        ${sideArts.map(a => `<section>${card(a)}</section>`).join("")}
        ${ed.blotter?.length ? `<section class="blotter"><h2>Police Blotter</h2><ul>${ed.blotter.map(b => `<li><span class="t">${esc(b.time)}</span> &middot; ${esc(b.where.replace(/\.$/, ""))}. ${fmt(b.text)}</li>`).join("")}</ul></section>` : ""}
        ${(ed.ads || []).map(ad => `<section class="ad"><div class="ad-head">${esc(ad.headline)}</div><div class="ad-body">${fmt(ad.body)}</div><div class="ad-foot">${esc(ad.footer || "")}</div>${note(ad.marginalia)}</section>`).join("")}
        ${ed.classifieds?.length ? `<section class="classifieds"><h2>Classifieds &amp; Personals</h2><ul>${ed.classifieds.map(c => `<li><b>${esc(c.heading)}</b>${fmt(c.text)}${note(c.marginalia)}</li>`).join("")}</ul></section>` : ""}
      </aside>
    </div>`;

  document.querySelectorAll(".article").forEach(el => {
    el.onclick = () => openArticle(el.dataset.id);
    el.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openArticle(el.dataset.id); } };
  });
  startCountdown();
}

function card(a, kind) {
  const body = Array.isArray(a.body) ? a.body : [a.body];
  const shown = kind === "lead" ? 2 : 1;
  const more = body.length > shown;
  return `<div class="article ${kind || a.size || ""}" data-id="${esc(a.id)}" tabindex="0" role="button">
    ${a.kicker ? `<div class="kicker">${esc(a.kicker)}</div>` : ""}
    <h2 class="headline">${esc(a.headline)}</h2>
    ${a.subhead ? `<p class="subhead">${esc(a.subhead)}</p>` : ""}
    ${a.byline ? `<div class="byline">${esc(a.byline)}</div>` : ""}
    ${a.image && kind === "lead" ? `<figure><img src="${esc(a.image)}" alt="${esc(a.caption || "")}"><figcaption>${esc(a.caption || "")}</figcaption></figure>` : ""}
    <div class="teaser">${body.slice(0, shown).map(t => `<p>${fmt(t)}</p>`).join("")}</div>
    ${more ? `<div class="more">Continued &rarr;</div>` : ""}
    ${note(a.marginalia)}
  </div>`;
}

function openArticle(id) {
  const a = (ed.articles || []).find(x => x.id === id);
  if (!a) return;
  $("#reader").innerHTML = `
    <button class="close" aria-label="Close">&times;</button>
    ${a.kicker ? `<div class="kicker">${esc(a.kicker)}</div>` : ""}
    <h2 class="headline">${esc(a.headline)}</h2>
    ${a.subhead ? `<p class="subhead">${esc(a.subhead)}</p>` : ""}
    ${a.byline ? `<div class="byline">${esc(a.byline)}</div>` : ""}
    ${a.image ? `<figure><img src="${esc(a.image)}" alt="${esc(a.caption || "")}"><figcaption>${esc(a.caption || "")}</figcaption></figure>` : ""}
    <div class="body">${paras(a.body)}</div>
    ${note(a.marginalia)}`;
  $("#readerWrap").classList.add("open");
  $("#reader .close").onclick = closeArticle;
  $("#reader .close").focus();
  history.replaceState(null, "", `?a=${encodeURIComponent(id)}${location.hash}`);
}
function closeArticle() {
  $("#readerWrap").classList.remove("open");
  history.replaceState(null, "", location.pathname + location.hash);
}
$("#readerWrap").onclick = e => { if (e.target.id === "readerWrap") closeArticle(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") closeArticle(); });

function startCountdown() {
  clearInterval(timer);
  const box = $("#countdown"), n = ed.nextSession || {};
  const when = n.when ? new Date(n.when) : null;
  const head = `<h3>${esc(n.title || "The Next Hunt")}</h3>`;
  if (!when || isNaN(when)) {
    box.innerHTML = `${head}<div class="tba">${fmt(n.tba || "Date to be announced. Tell your GM when you're free.")}</div>${note(n.marginalia)}`;
    return;
  }
  const tick = () => {
    let ms = when - Date.now();
    if (ms <= 0) { box.querySelector(".clock").textContent = n.nowText || "Tonight. Bring a flashlight."; clearInterval(timer); return; }
    const d = Math.floor(ms / 864e5), h = Math.floor(ms / 36e5) % 24, m = Math.floor(ms / 6e4) % 60, s = Math.floor(ms / 1e3) % 60;
    box.querySelector(".clock").textContent = `${d}d ${String(h).padStart(2,"0")}h ${String(m).padStart(2,"0")}m ${String(s).padStart(2,"0")}s`;
  };
  box.innerHTML = `${head}<div class="clock"></div>
    <div class="when">${esc(when.toLocaleString(undefined, {weekday: "long", month: "long", day: "numeric", hour: "numeric", minute: "2-digit"}))}${n.where ? ` &middot; ${esc(n.where)}` : ""}</div>
    <button id="calBtn">Add to my calendar</button>${note(n.marginalia)}`;
  tick(); timer = setInterval(tick, 1000);
  $("#calBtn").onclick = () => {
    const f = d => d.toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
    const end = new Date(when.getTime() + (n.hours || 4) * 36e5);
    const ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//STL Gazette//EN","BEGIN:VEVENT",
      `UID:${f(when)}@stl-gazette`, `DTSTAMP:${f(new Date())}`, `DTSTART:${f(when)}`, `DTEND:${f(end)}`,
      `SUMMARY:${(n.calendarTitle || "Hunter: St. Louis By Night")}`, n.where ? `LOCATION:${n.where}` : "", `URL:${location.href.split("?")[0]}`,
      "END:VEVENT","END:VCALENDAR"].filter(Boolean).join("\r\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([ics], {type: "text/calendar"}));
    a.download = "next-session.ics"; a.click();
  };
}

$("#uvBtn").onclick = () => {
  const on = document.body.classList.toggle("uvon");
  $("#uvBtn").setAttribute("aria-pressed", on);
  $("#uvBtn").textContent = on ? "Lights on" : "Hold to the black light";
};
$("#shareBtn").onclick = async () => {
  const url = location.href.split("?")[0];
  try {
    if (navigator.share) await navigator.share({title: document.title, url});
    else { await navigator.clipboard.writeText(url); $("#shareBtn").textContent = "Link copied"; setTimeout(() => $("#shareBtn").textContent = "Share", 2000); }
  } catch (e) {}
};

boot();
</script>
</body>
</html>
